services:
  seed:
    image: smart-home-max-backend
    # Test companies, houses on the map, residents and incidents.
    command: ["sh", "-c", "apps/backend/node_modules/.bin/tsx apps/backend/prisma/seed.ts && apps/backend/node_modules/.bin/tsx apps/backend/prisma/seed-extra.ts && apps/backend/node_modules/.bin/tsx apps/backend/prisma/seed-real.ts && apps/backend/node_modules/.bin/tsx apps/backend/prisma/default-codes.ts && apps/backend/node_modules/.bin/tsx apps/backend/prisma/seed-company-demo.ts"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-smart_home}?schema=public
      MAX_MODE: fake
      MAX_RECEIVE_MODE: none
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-change-me-webhook-secret}
      APARTMENT_CODE_PEPPER: ${APARTMENT_CODE_PEPPER:-change-me-apartment-code-pepper}
      ADMIN_COOKIE_SECURE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    depends_on:
      seed:
        condition: service_completed_successfully

  worker:
    depends_on:
      seed:
        condition: service_completed_successfully
