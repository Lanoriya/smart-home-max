# Map tiles of OpenStreetMap through this server, cached for a month: they
# arrive fast and the tile servers are asked once per tile, as their usage
# policy asks.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:20m max_size=2g inactive=60d use_temp_path=off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Behind Caddy nginx must not build absolute redirects: it would point them
  # to its own port 8080 over plain HTTP.
  absolute_redirect off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:3000;

  location /api/ {
    # Photos of a problem from the mini-app: up to three in one request.
    client_max_body_size 4m;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location ~ ^/tiles/(\d+)/(\d+)/(\d+)\.png$ {
    set $tile_host tile.openstreetmap.org;
    proxy_pass https://$tile_host/$1/$2/$3.png;
    proxy_ssl_server_name on;
    proxy_set_header Host $tile_host;
    proxy_set_header User-Agent "Domoved/1.0 (+https://jorwey.ru; MAX hackathon)";
    proxy_set_header Referer "https://jorwey.ru/";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_cache tiles;
    proxy_cache_key $1/$2/$3;
    proxy_cache_valid 200 30d;
    proxy_cache_valid any 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Tile-Cache $upstream_cache_status;
  }

  # The privacy policy used to be a static page: its old address leads to the current text.
  location = /privacy.html {
    return 301 /api/privacy/page;
  }

  location /health/ {
    proxy_pass $backend_upstream;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /webhooks/max {
    proxy_pass $backend_upstream;
    proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  # The mini-app is registered in MAX as https://<domain>/app without the
  # slash: it is served right there, without a redirect.
  location = /app {
    try_files /app/index.html =404;
  }

  # MAX mini-app: a single-page app with its own index.
  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  # The web desk: no other site may frame it (clickjacking), and the page
  # runs only its own scripts. The mini-app under /app/ is opened inside MAX
  # and keeps its own rules.
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
