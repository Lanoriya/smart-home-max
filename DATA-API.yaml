# Verify schemaVersion against the DATA-API specification issued by the organisers.
schemaVersion: '1.0'
solution: 'Дом в порядке'
baseUrl: 'https://jorwey.ru'
checks:
  - name: 'Health check'
    method: GET
    path: /health/live
    role: public
    expectedStatusCodes: [200]
    expectedContentType: application/json
    requiredResponseFields: [status]
  - name: 'Dispatcher login'
    method: POST
    path: /api/admin/session
    role: dispatcher
    request:
      contentType: application/json
      body: { username: '${TEST_DISPATCHER_USERNAME}', password: '${TEST_DISPATCHER_PASSWORD}' }
    expectedStatusCodes: [200]
    expectedContentType: application/json
    requiredResponseFields: [admin]
  - name: 'Incident queue'
    method: GET
    path: /api/incidents
    role: dispatcher
    request: { cookieFrom: 'Dispatcher login' }
    expectedStatusCodes: [200]
    expectedContentType: application/json
    requiredResponseFields: [items]
  # Запускать на свежей локальной demo-БД после Incident queue.
  # TEST_INCIDENT_ID=d5000001-0000-4000-8000-000000000001, TEST_INCIDENT_VERSION=1.
  # При повторном запуске пересоздайте demo-БД: docker compose -f compose.yaml -f compose.demo.yaml down -v.
  - name: 'Update incident status'
    method: PATCH
    path: /api/incidents/${TEST_INCIDENT_ID}
    role: dispatcher
    request:
      cookieFrom: 'Dispatcher login'
      contentType: application/json
      body:
        version: '${TEST_INCIDENT_VERSION}'
        status: acknowledged
        dueAt: null
        publicComment: 'Тестовое изменение статуса диспетчером.'
    expectedStatusCodes: [200]
    expectedContentType: application/json
    requiredResponseFields: [item]
